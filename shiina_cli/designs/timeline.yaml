# timeline — warm amber ledger, progress-forward.
#
# The work is the surface. A persistent step ledger sits above the composer with
# the running turn's steps and the calls in flight counting elapsed time, so the
# shape of a turn stays visible while it happens instead of folding away behind
# a chevron. Heavy markers separate done (`✔`) from running (`⬤`), and the
# reasoning stays a compact running line rather than a wall of prose.

name: timeline
description: "Progress-forward amber ledger — the turn's steps stay on screen."
extends: default

colors:
  accent: "#fbbf24"
  border: "#92400e"
  completionBg: "#292524"
  completionCurrentBg: "#44403c"
  completionMetaBg: "#292524"
  completionMetaCurrentBg: "#44403c"
  error: "#f87171"
  label: "#fcd34d"
  muted: "#a16207"
  ok: "#4ade80"
  primary: "#f59e0b"
  prompt: "#fbbf24"
  selectionBg: "#44403c"
  sessionBorder: "#78350f"
  sessionLabel: "#fcd34d"
  shellDollar: "#fb923c"
  statusBad: "#f87171"
  statusBg: "#292524"
  statusCritical: "#ef4444"
  statusFg: "#fef3c7"
  statusGood: "#4ade80"
  statusWarn: "#fbbf24"
  syntaxComment: "#a16207"
  syntaxKeyword: "#fb923c"
  syntaxNumber: "#fcd34d"
  syntaxString: "#4ade80"
  text: "#fef3c7"
  thinking: "#a16207"
  tool: "#fbbf24"
  warn: "#fbbf24"

prompt: "▌"

design:
  density: compact
  panel: bold
  alert: bold
  rule: "━"
  glyphs:
    active: "▶"
    bullet: "⬤"
    cache: "◈"
    chain: "⛓"
    check: "✔"
    chevronClosed: "▸"
    chevronOpen: "▾"
    focus: "◉"
    idle: "✔"
    latency: "◷"
    pending: "·"
    resume: "↩"
    separator: " │ "
    statusHead: "━ "
    tps: "↑"
  status_bar:
    segments: [model, cwd, tokens, cost, duration]

spinner:
  think: [dna, helix, snake]
  tool: [rain, columns, fillsweep]

layout:
  regions:
    agentsDock: false
    dock: true
    fileChanges: true
    ledger: true
    pet: false
    rails: false
    scrollbar: true
    sideColumn: false
    statusRule: true
    stickyPrompt: false
    todoUnderPrompt: false
  sections:
    activity: collapsed
    subagents: expanded
    thinking: collapsed
    tools: expanded
